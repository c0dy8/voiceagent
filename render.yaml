services:
  # ── Backend ────────────────────────────────────────────
  - type: web
    name: chefbot-backend
    runtime: python
    pythonVersion: "3.11"
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: RAG_SOURCE_URL
        value: https://en.wikipedia.org/wiki/Cooking
      - key: FRONTEND_URL
        value: https://chefbot-frontend.onrender.com
    disk:
      name: chroma-db
      mountPath: /opt/render/project/src/chroma_db
      sizeGB: 1
    healthCheckPath: /health
    autoDeploy: true

  # ── Frontend ───────────────────────────────────────────
  - type: web
    name: chefbot-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://chefbot-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    autoDeploy: true
